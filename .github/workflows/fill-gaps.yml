name: Fill selected contribution gaps

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Preview dates without creating or pushing commits
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: contribution-gap-fill
  cancel-in-progress: false

jobs:
  fill:
    if: github.repository == 'raniduNF26/priv' && github.actor == 'raniduNF26'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Create one synthetic commit per selected empty day
        env:
          PREVIEW_ONLY: ${{ inputs.preview_only }}
          GAP_DATES: 
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, pathlib, subprocess
          def git(*args, env=None):
              return subprocess.check_output(['git', *args], env=env, text=True).strip()
          dates = json.loads(base64.b64decode(os.environ['GAP_DATES']))
          assert len(dates) == len(set(dates))
          assert all('2025-01-01' <= d <= '2026-10-13' for d in dates)
          for d in dates:
              datetime.date.fromisoformat(d)
          assert git('remote', 'get-url', 'origin') == 'https://github.com/raniduNF26/priv'
          log = pathlib.Path('.activity/synthetic-days.txt')
          recorded = set(log.read_text().splitlines()) if log.exists() else set()
          pending = [d for d in dates if d not in recorded]
          print(f'Planned: {len(pending)} synthetic commits; {len(recorded)} already recorded.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Contribution gap fill\n\n{len(pending)} selected empty days, 2025–2026 through 13 October 2026.\n\nSynthetic activity; not historical project work.\n')
              summary.write('\nDates: ' + ', '.join(pending) + '\n')
          if os.environ['PREVIEW_ONLY'] == 'true':
              print('Preview only; no commits or push.')
              raise SystemExit(0)
          git('config', 'user.name', 'Ranidu Fernando')
          git('config', 'user.email', 'nethra.fernando7@gmail.com')
          start = git('rev-parse', 'HEAD')
          log.parent.mkdir(exist_ok=True)
          for d in pending:
              with log.open('a') as f:
                  f.write(d + '\n')
              git('add', str(log))
              timestamp = d + 'T12:00:00+05:30'
              env = dict(os.environ, GIT_AUTHOR_DATE=timestamp, GIT_COMMITTER_DATE=timestamp)
              git('commit', '-m', 'Synthetic calendar entry: ' + d, env=env)
          assert int(git('rev-list', '--count', start + '..HEAD')) == len(pending)
          if pending:
              git('push', 'origin', 'HEAD:main')
          print(f'Published {len(pending)} synthetic commits with no history rewrite.')
          PY
